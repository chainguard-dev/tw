name: Shell-syntax-check pipeline validation tests

description: Test suite for test/tw/shell-syntax-check pipeline

testcases:
  - name: Valid shell files in shell-syntax-check-test-good
    description: A valid bash completion and sh script pass
    package: shell-syntax-check-test-good
    pipelines:
      - uses: test/tw/shell-syntax-check
    expect_pass: true
  - name: Broken bash completion in shell-syntax-check-test-bad
    description: A completion with a syntax error fails through the bash wrapper
    package: shell-syntax-check-test-bad
    pipelines:
      - uses: test/tw/shell-syntax-check
    expect_pass: false
  - name: No shell files in giflib-doc
    description: A package with no shell files fails, even though the test environment has some
    package: giflib-doc
    pipelines:
      - uses: test/tw/shell-syntax-check
    expect_pass: false
  - name: Bash completion in bubblewrap-bash-completion
    description: A real Wolfi package with a bash completion passes
    package: bubblewrap-bash-completion
    pipelines:
      - uses: test/tw/shell-syntax-check
    expect_pass: true
  - name: Shell script in hollywood
    description: A real Wolfi package with a shell script in usr/bin passes
    package: hollywood
    pipelines:
      - uses: test/tw/shell-syntax-check
    expect_pass: true
